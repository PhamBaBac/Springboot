server:
  port: ${SERVER_PORT:8080}

spring:
  main:
    allow-circular-references: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:file:.env[.properties]
  security:
    oauth2:
      client:
        registration:
          github:
            clientId: ${GITHUB_CLIENT_ID:}
            clientSecret: ${GITHUB_CLIENT_SECRET:}
            redirectUri: ${GITHUB_REDIRECT_URI:http://localhost:8080/login/oauth2/code/github}
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${EMAIL:}
    password: ${PASS_EMAIL:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/kanban}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/chat}
      database: ${MONGODB_DATABASE:chat}
      auto-index-creation: true
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    generate-ddl: true
    show-sql: ${SHOW_SQL:true}

  ai:
    openai:
      api-key: ${OPEN_AI_API_KEY:}
      chat:
        completions-path: /v1beta/openai/chat/completions
        base-url: https://generativelanguage.googleapis.com
        options:
          model: ${AI_MODEL:gemini-2.5-flash}

    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

application:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:3004}
  cookie:
    secure: ${COOKIE_SECURE:false}
  oauth2:
    authorized-redirect-uri: ${OAUTH2_AUTHORIZED_REDIRECT_URI:http://localhost:3004/auth/oauth-callback}
  security:
    jwt:
      secret-key: ${KEY_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration: ${JWT_EXPIRATION:86400000}
      refresh-token:
        expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  vnpay:
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payment/vnpay-return}
    tmn-code: ${VNPAY_TMN_CODE:7VS65JJC}
    hash-secret: ${VNPAY_HASH_SECRET:PISJVMJHTRJOLOGZFKOTAERXRKTYFNKP}
  momo:
    pay-url: ${MOMO_PAY_URL:https://test-payment.momo.vn/v2/gateway/api/create}
    return-url: ${MOMO_RETURN_URL:http://localhost:8080/api/v1/payment/momo-return}
    ipn-url: ${MOMO_IPN_URL:http://localhost:8080/api/v1/payment/momo-return}
    partner-code: ${MOMO_PARTNER_CODE:MOMO}
    access-key: ${MOMO_ACCESS_KEY:F8BBA842ECF85}
    secret-key: ${MOMO_SECRET_KEY:K951B6PE1waDMi640xX0huTrY0hs6AHQ}
  ghn:
    base-url: ${GHN_BASE_URL:https://dev-online-gateway.ghn.vn/shiip/public-api}
    token: ${GHN_TOKEN:e0578753-b28e-11f1-a973-aee5264794df}
    shop-id: ${GHN_SHOP_ID:221254}

logging:
  level:
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
    org.mongodb.driver: ${LOG_LEVEL_MONGODB:WARN}