<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Kết quả thanh toán</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: #fafbfc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 16px;
        }
        .order-confirm-card {
            max-width: 420px;
            width: 100%;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            padding: 40px 32px 36px 32px;
            text-align: center;
        }
        .order-icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px auto;
        }
        .order-icon.success {
            background: #e6f9ed;
            color: #1a9e52;
            box-shadow: 0 0 0 8px #f2fbf6, 0 0 0 16px #e6f9ed;
        }
        .order-icon.failed {
            background: #feeeee;
            color: #d93025;
            box-shadow: 0 0 0 8px #fff5f5, 0 0 0 16px #feeeee;
        }
        .order-icon svg {
            width: 36px;
            height: 36px;
        }
        .order-title {
            font-size: 1.45rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: #18181a;
        }
        .order-desc {
            color: #555;
            font-size: 0.98rem;
            line-height: 1.55;
            margin-bottom: 28px;
        }
        .info-box {
            background: #f8f9fa;
            border: 1px solid #ebedf0;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 24px;
            text-align: left;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .info-row:last-child {
            margin-bottom: 0;
        }
        .info-label {
            color: #888;
        }
        .info-value {
            font-weight: 600;
            color: #222;
        }
        .btn-black {
            background: #18181a;
            color: #fff;
            border-radius: 12px;
            border: none;
            width: 100%;
            font-size: 1.02rem;
            font-weight: 600;
            padding: 13px 0;
            margin-bottom: 10px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s;
        }
        .btn-black:hover {
            background: #000;
            color: #fff;
            transform: translateY(-1px);
        }
        .btn-outline-black {
            border: 1.5px solid #d0d5dd;
            color: #344054;
            border-radius: 12px;
            width: 100%;
            font-size: 1.02rem;
            font-weight: 500;
            padding: 12px 0;
            background: #fff;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s;
        }
        .btn-outline-black:hover {
            background: #f9fafb;
            color: #18181a;
            border-color: #98a2b3;
        }
    </style>
</head>
<body>
<div class="order-confirm-card">
    <div id="icon-container" class="order-icon success">
        <!-- Icon injected by JS -->
    </div>
    <div id="result-title" class="order-title">Đang kiểm tra kết quả...</div>
    <div id="result-desc" class="order-desc">
        Vui lòng đợi giây lát trong khi chúng tôi xác nhận giao dịch.
    </div>
    <div id="info-box" class="info-box" style="display: none;">
        <!-- Info details injected by JS -->
    </div>
    <a id="btn-primary" href="http://localhost:3004/profile?tab=orders" class="btn btn-black">Xem đơn hàng</a>
    <a id="btn-secondary" href="http://localhost:3004/" class="btn btn-outline-black">Về trang chủ</a>
</div>

<script>
    (function () {
        const urlParams = new URLSearchParams(window.location.search);
        const responseCode = urlParams.get("vnp_ResponseCode");
        const txnRef = urlParams.get("vnp_TxnRef");
        const transactionNo = urlParams.get("vnp_TransactionNo");
        const amount = urlParams.get("vnp_Amount");

        const iconContainer = document.getElementById("icon-container");
        const resultTitle = document.getElementById("result-title");
        const resultDesc = document.getElementById("result-desc");
        const infoBox = document.getElementById("info-box");
        const btnPrimary = document.getElementById("btn-primary");
        const btnSecondary = document.getElementById("btn-secondary");

        const isSuccess = responseCode === "00";

        if (isSuccess) {
            document.title = "Thanh toán thành công";
            iconContainer.className = "order-icon success";
            iconContainer.innerHTML = `
                <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
            `;
            resultTitle.textContent = "Thanh toán thành công!";
            resultDesc.innerHTML = "Cảm ơn bạn đã mua sắm! Giao dịch thanh toán trực tuyến của bạn đã hoàn tất và đơn hàng đã được tạo thành công.";

            if (txnRef || transactionNo) {
                infoBox.style.display = "block";
                let html = "";
                if (txnRef) {
                    html += `<div class="info-row"><span class="info-label">Mã tham chiếu:</span><span class="info-value">${txnRef}</span></div>`;
                }
                if (transactionNo && transactionNo !== "0") {
                    html += `<div class="info-row"><span class="info-label">Mã đối tác:</span><span class="info-value">${transactionNo}</span></div>`;
                }
                infoBox.innerHTML = html;
            }

            btnPrimary.textContent = "Xem đơn hàng của bạn";
            btnPrimary.href = "http://localhost:3004/profile?tab=orders";
            btnSecondary.textContent = "Tiếp tục mua sắm";
            btnSecondary.href = "http://localhost:3004/";
        } else {
            document.title = "Thanh toán chưa hoàn tất";
            iconContainer.className = "order-icon failed";
            iconContainer.innerHTML = `
                <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            `;
            resultTitle.textContent = "Giao dịch chưa hoàn tất";

            let reason = "Giao dịch thanh toán đã bị hủy hoặc gặp sự cố.";
            if (responseCode === "24" || responseCode === "1006") {
                reason = "Bạn đã hủy giao dịch trên cổng thanh toán.";
            } else if (responseCode === "51" || responseCode === "9000") {
                reason = "Tài khoản của bạn không đủ số dư để thực hiện giao dịch.";
            } else if (responseCode === "11") {
                reason = "Giao dịch đã hết hạn chờ thanh toán.";
            }

            resultDesc.innerHTML = `${reason}<br><strong style="color: #2e7d32;">Sản phẩm vẫn được lưu nguyên vẹn trong giỏ hàng</strong> để bạn có thể tiếp tục thanh toán.`;

            btnPrimary.textContent = "Quay lại giỏ hàng";
            btnPrimary.href = "http://localhost:3004/shop/checkout?from_payment=failed";
            btnSecondary.textContent = "Về trang chủ";
            btnSecondary.href = "http://localhost:3004/";
        }
    })();
</script>
</body>
</html>
